# Automation attempts per labelling task, for the section-3/4 figure (analysis/codesign/figures.py,
# paper_automation). Each entry points to its timeline.yaml entry (timeline_label); sources are there.
#
# outcome:
#   deployed       used in Lite's labelling or laser calibration (mobile app noted where it applies)
#   reverted       used, then replaced by human labels
#   dropped        not kept: poor accuracy (author, 2026-10-07), or replaced by another model where noted
#   evaluated      evaluated in analysis only, not deployed
#   unrecorded     no record of outcome
# start/end: dates of the attempt (YYYY-MM-DD); end_event: the date the outcome happened, if known.
#
# Counting laser-dot detection methods for the paper (author, 2026-10-19): count distinct detection
# methods. Exclude the 2023 guess-correction script (it refines a given location rather than finding
# the dot), and count a model once even if it was used in more than one place (method: groups uses of
# one model). Entries without `method` are not counted.
#
# Definitions (records audit, 2026-10-21; claims.yaml uses these):
#   attempt          one entry below: a dated use of a model or method on a labelling task.
#                    Laser dot: 8 attempts before the deployed detector (2023-07..2025-11), 9 with it
#                    (updated 2026-10-21 for the two classical methods).
#   distinct method  an attempt with `method`, counted once per method (rule above).
#                    Laser dot (updated 2026-10-21): 5 before the deployed detector (brightest spot;
#                    2D Gaussian fit; NNLaserDetector, used three times; GMM; Depth Anything), 6 with
#                    it. The 2023-09 demo checkpoint and the 2024 NNLaserDetector are one model: same
#                    architecture and byte-identical weights (sha256 57b19f89...4f08, 133,975 bytes, in
#                    fishsense-lite-cli@860c801 demo/data/models/laser_detection.pth and in the Hugging
#                    Face annotator114/laser-detector file that pyFishSenseDev@6410719 downloads). The 2D
#                    Gaussian fit rests on the author's account alone (no code found).
# The SenSys introduction's "five methods failed before a sixth worked" matches this count.

- task: laser dot
  label: guess-correction script
  start: 2023-07-11
  outcome: unrecorded
  timeline_label: "laser-dot guess correction"
- task: laser dot
  label: brightest spot (saturated-pixel blob on the laser line)
  method: brightest spot
  start: 2023-07-13
  end_event: 2023-09-21
  outcome: dropped
  reason: "bubbles, reflections and, in low light, sensor noise amplified by the camera's gain are often brighter than the dot (author account, 2026-10-19; no code, commit or note records the reason). Code: pyFishSenseDev_bak@1113e62 2023-07-13 'Pulled changes from main and completed laser detection code' (detect_laser.py detect_laser_raw: cv2.inRange(masked_raw, 255, 256) on the max-normalised RAW inside the laser-line mask); threshold lowered to 250 at dac85dc 2023-07-31; still present at 004bfea 2023-09-18; superseded by the packaged NN laser_detector.py at 3b81397 2023-09-21. An argmax variant (average_pool_test.py, 310c771 2023-07-20) was commented out when added and deleted 2023-08-02 (8083155). The NN that followed still uses the brightest points as its candidates (peak_local_max on the red channel). Dive 279's red-speck false positives (imwut_2026_fishsense_lite fish_model_analysis/IN_PLANE_DRIFT.md:347-358, ce372d6 2026-10-18) show bright specks taken for the laser, but that record does not mention low light or gain."
  timeline_label: null
- task: laser dot
  label: 2D Gaussian fit on the brightness channel
  method: 2D Gaussian fit
  start: "2023-08"
  outcome: dropped
  reason: "the laser dot is clipped, so its top is flat (author account, 2026-10-19). No code found: searched every pyFishSenseDev, pyFishSenseDev_bak, fishsense-lite-cli and older E4E FishSense repo history for curve_fit, least_squares, lmfit, Gaussian2D and similar, plus org-wide code, issue and PR search (2026-10-21); pyFishSenseDev_bak2 (2024-05..09) was not searched. The start date is inferred, not recorded: placed between the brightest-spot code (2023-07) and the neural network (2023-09) following the author's ordering."
  timeline_label: null
- task: laser dot
  label: CLI neural detector (demo checkpoint)
  method: NNLaserDetector
  start: 2023-09-22
  outcome: unrecorded
  note: "same model as the 2024 NNLaserDetector: identical architecture (Conv2d(3,32,3) -> AvgPool -> Linear(3200,10) -> Linear(10,1) on 20x20 tiles) and byte-identical weights (sha256 57b19f89...4f08). Code: pyFishSenseDev_bak@3b81397 2023-09-21 'support laser detection'; demo fishsense-lite-cli@860c801 (2023-09-21 23:50 -0700)."
  timeline_label: "CLI laser detector"
- task: laser dot
  label: neural detector in laser calibration
  method: NNLaserDetector
  start: 2024-09-13
  end_event: 2025-03-25
  outcome: reverted
  reason: "too inaccurate (author account, 2026-10-07 and 2026-10-19; no commit records the reason). Removed in two steps: checkerboard calibration 2025-01-21 (fishsense-lite-cli de881b42), field calibration by 2025-03-25 (bf8cbc8a). Same model as the 2024-11 pre-fill (author)."
  timeline_label: "NN laser detector, then back to human labels"
- task: laser dot
  label: neural-detector pre-fill in Label Studio
  method: NNLaserDetector
  start: 2024-11-09
  end_event: "2024-11"
  outcome: reverted
  reason: "turned on to help labellers; predictions were wrong often, labellers found constantly correcting them annoying and found it faster to label without assistance, so it was withdrawn (author account, 2026-10-19). No revert commit exists; the withdrawal rests on the author's account. Dates from commits c1c447d3..708a2ce3; end date approximate (only 2024-11 seeded labels survive)"
  timeline_label: "CLI Label Studio pre-fill"
- task: laser dot
  label: Gaussian-mixture detector
  method: Gaussian-mixture colour detector
  start: 2025-04-21
  outcome: dropped
  reason: poor accuracy (author); ~1,009 px RMS vs human labels on 3,048 frames
  timeline_label: "GMM laser detector"
- task: laser dot
  label: Depth Anything detector
  method: fine-tuned Depth Anything
  start: 2025-08-29
  end_event: 2025-11-30
  outcome: dropped
  reason: poor accuracy (author)
  timeline_label: "Depth Anything laser detector"
- task: laser dot
  label: RAW U-Net detector (run3) pre-fill, then auto-accept
