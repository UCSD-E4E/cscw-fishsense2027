  confounds: "stored calibration; reef dives with a stored calibration only (314 frames); frames of one fish are not independent (exact subsampling assumes any k frames are equally likely to be taken); fish with >= 4 frames may differ from typical fish; median 2 frames per fish, so few fish reach k = 4"
  paper_section: 7, 9

- claim: A person spends a median of 14 s per label drawn without a pre-fill (laser 12.9 s, snout+fork 15.0 s, species 12.1 s; slate corners 61.3 s per slate frame); about 40 s per measured frame.
