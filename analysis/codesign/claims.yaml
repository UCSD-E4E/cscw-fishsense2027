- claim: "Per fish, about 79% receive at least one automatic length and 72% one within 10% of manual; each extra frame helps - on fish photographed at least 4 times, a length within 10% rises from 71% with one frame to 85% with two, 91% with three and 96% with four."
  number: "labelled clusters (de-duplicated): 97 fish, 79.4% / 72.2%; predicted clusters: 149 fish, 78.5% / 72.5% (replaces 80.6% / 73.5%, which came from an unrecorded de-duplication). Fixed set, predicted clusters (22 fish, >= 4 frames), within 10%: 0.714 / 0.845 / 0.914 / 0.964 for k = 1..4 (k = 1 CI 0.47-0.84); labelled clusters (28 fish): 0.751 / 0.853 / 0.889 / 0.907."
