  source: p2-tests.md E1k; calibration_analysis/e1k_beam_streak
  confounds: water clarity; 7 dives
  paper_section: 6

- claim: At deployed exposure 84% of laser dots are clipped (98-100% below 1.5 m); the Bayer mosaic does not rescue them.
  number: "84% (590 of 701 dots; dive-resampled 95% CI 78-90%, 24 dives); 99% below 1.5 m (259/262), 75% at 1.5 m and beyond. 700 of the 701 dots are red, so this is a red-laser number; green photosites clip on 11/20, red 13/20, blue 5/20 (raw-mosaic check)"
  evidence_level: retrospective
