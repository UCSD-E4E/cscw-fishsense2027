- claim: "On four reef dives, a label-free calibration (SAM 3.1 slate mask, no corner labels) places the laser's vanishing point within 2-9 px of the stored labelled calibration and changes manual reef lengths by a median +1.1% (MAE 2.6%); with each dive's stored |O| the angle alone changes them by 1.3% MAE. Fully automatic reef length with the label-free calibration: median +2.8%, MAE 6.1%, 80% within 10% (stored calibration: -0.1%, 5.0%, 84%)."
  number: "dives 341/347/349/436, 68 slate frames (12-30 per dive, size spread 2.0-3.1x); vanishing-point offset -3.4/+2.4/+1.9/+8.9 px, 0.04-0.18 deg from stored; per-dive size x distance residual sd 0.6-1.7%; 224 reef frames (197 fully automatic). Dive 347: angle only +1.4%, with the 104 mm |O| stand-in +4.4% (its stored |O| is 101.0 mm). Human corner labels as the unknown-size measure (complete labels only, 6 points on the V-slate) do worse on the same reef dives: MAE 5.5%, 89% within 10% (341: 1.1%, 347: 6.5%, 349: 11.5%), because 24% of V-slate frames carry a skipped point and must be dropped - dive 349 keeps 8 frames at 1.27x spread, below what size constancy needs (3c)."
