  track: field
  driver: other
  driver_detail: physical failure - the first unit shipped to the partner had a PLA mount that warped and broke over time, so its laser calibration drifted.
  evidence: author account, 2026-10-06 (answers recorded in questions.md R)
  confidence: medium (reason); low (date)
  dives_before: unknown
  dives_after: n/a

- date: 2023-08 (14-18 Aug)
  component: calibration
  change: Lab laser calibration with a planar printed checkerboard (the pool sessions shot it in the same session).
  label: "lab: checkerboard"
  track: lab
  driver: machine
  driver_detail: '"a machine could find it" - the checkerboard is detected automatically (author, 2026-10-07)'
  evidence: "imwut_2026_fishsense_lite/PAPER.md L259-264 (\"The first nineteen sessions (14-18 August) used a planar checkerboard ... The remaining twelve (29-31 August) used the duct-tape dive slate ... We moved *away* from the checkerboard deliberately\"); DB: 15 dives with calibration_target_id = 1 (E4E Checkerboard, 10x14, 42.17 mm pitch), 2023-08-14..18, named LaserCalibration*; dive 490 note (checkerboard burst with the laser on, laser rotated 0.82 deg in-plane between fish frames and board burst); dive 521 note (laser-calibration and lens-calibration frames in one folder, lens frames have no laser) - so the board was used for laser calibration, distinct from lens calibration. TG-7 units again calibrated against checkerboards on 2025-01-17 (dives 480, 481); PerformCheckerboardCalibration automated 2026-09-08."
  confidence: high
  dives_before: 0
  dives_after: "15 dives linked to the E4E Checkerboard target (DB dive.calibration_target_id = 1), 2023-08-14..18"
  note: "Not a switch: the checkerboard and the slate were used concurrently, split by setting (author, 2026-10-07). Order per the author: the checkerboard came first, for lab laser calibration; a mount broke while other cameras were being prepared for shipping and the H slate was improvised; new cameras continued with the proven method; the lab stayed on the checkerboard and the field became the slate. The DB's dates interleave (field H slate 2023-08-01, pool checkerboard 2023-08-14..18) because many cameras and techniques overlapped. The IMWUT draft's 'moved away from the checkerboard deliberately' (PAPER.md L259-264) describes the pool study only."

