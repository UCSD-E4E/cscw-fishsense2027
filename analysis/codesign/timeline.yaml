# ---------------------------------------------------------------- hardware
- date: 2023-08 .. 2024-12 (staggered by camera)
  component: hardware
  change: "Laser red -> green. Per camera (first mostly-green dive): FSL-02 2024-03, FSL-06 2024-03, FSL-01 2024-06, FSL-04 2024-06, FSL-05 2024-06, FSL-03 2024-12. Isolated green dives in 2023 (2023-10-19, 2023-10-27) are probably camera-clock or test dives."
  driver: human
  driver_detail: diver visibility - divers found red hard to see; green accepted despite its expected effect on fish behaviour.
  evidence: "DB laserlabel colour per dive (>=90% of a dive's labels one colour), grouped by camera and month; project lead, analysis session 2026-09-26 (green lasers 'are easier on the diver') and author account 2026-10-06"
  confidence: medium
  dives_before: "mostly-red dives: 2023-08..2024-02: 171; 2024 mixed by camera"
  dives_after: "mostly-green dives 2024-03..2024-12: 97 (red still on FSL-03 until 2024-12)"
  note: "Staggered adoption gives concurrent red and green dives at the same sites; usable for task 3d. Author account: red was chosen first because fish behaviour should be less affected (not all species see red), and red was easier to label because more of the ocean is green. CONFLICT: papers/fishsense-lite-imwut/Sections/system.tex L163 says green was chosen 'because it penetrates water further, and reliable detection of the laser dot in post-processing is a critical constraint' - a machine-side reason. See questions.md A2."

- date: 2023-08 onward (constraint, not a revision)
  component: hardware
  change: "Lasers are commodity, eye-safe dive laser pointers; their power was never controlled. Recorded models: 'Innovative Scuba Aluminum Laser Pointer (Red)' ($89.95, IMWUT cost table). Green: two different products, a 'Shark' laser (apparently no longer sold) and an Orca Torch laser (author account 2026-10-06); the IMWUT text describes the green as a 'Class IIIA waterproof green (532 nm) pointer' without naming a product."
  driver: n/a (constraint)
  evidence: "author account 2026-10-06; papers/fishsense-lite-imwut/Sections/system.tex L11 and L163. No laser model, part number or power field in the DB (camera: id, serial_number, name; dive: no laser field); no dive note names a laser."
  confidence: medium
  dives_before: n/a
  dives_after: n/a
  note: "Which green product was on which camera, and when, is unknown (no DB field) - questions.md B1. The two green products may differ in power, divergence and dot shape, which confounds the red-vs-green comparison (task 3d). Whether the red product changed is unknown. The Shark laser's apparent discontinuation is itself a commodity-supply constraint. The partner's newer, separate system uses higher-powered lasers; it is not a revision of this system."

- date: throughout deployment (revision dates unknown)
  component: hardware
  change: Printed PLA laser mount redesigned repeatedly; PLA mounts warped and split, and replacements were sent to some units.
  driver: other
  driver_detail: field breakage drove each revision.
  evidence: "author account 2026-10-06; imwut_2026_fishsense_lite/PAPER.md L427-428 ('the laser mounts are printed PLA, they had been splitting, and replacements were sent out, but which units received one')"
  confidence: high (that it happened); low (when, which units, how many revisions)
  dives_before: unknown
  dives_after: unknown
  note: "No mount CAD, STL or revision record found (local repos, fishsense-lite git history, UCSD-E4E repo trees). The IMWUT text cites the mount file as available in UCSD-E4E/fishsense-lite, but that repo holds none. The only recorded geometry is the fitted laser origin: median |O| 104.0 mm over 31 stored calibrations (DB laserextrinsics.laser_position); origin -30.9 +/- 1.0 mm x, -101 +/- 5.7 mm y over 6 calibrations (fishsense-lite/docs/laser-calibration-fingerprint-roadmap.md)."

- date: unknown
  component: hardware
  change: Mount material PLA -> aluminium for field units (end of the mount revisions; PLA still intended for citizen scientists).
  driver: other
  driver_detail: field breakage (durability). Anecdotally aluminium holds laser calibration better; tested in analysis 3f.
  evidence: "project lead, analysis session 2026-09-24/25 (frequent lab deployments made PLA mounts fail); author account 2026-10-06"
  confidence: medium (change), low (date, which units)
  dives_before: unknown
  dives_after: unknown
  note: no mount-material field in the DB and no dive note on repairs or knocks, so 3f needs a per-camera material/date list from the author (questions.md B4). Related - dive 490's note records the laser rotating 0.82 deg in-plane within one pool session (2023-08-14, FSL-02).

- date: 2025-01 (first dives 2025-01-17)
  component: hardware
  change: Camera Olympus TG-6 -> OM System TG-7 for units FSL-08 and later.
  driver: unknown
  evidence: "DB camera table: FSL-09/10/11 serials BJPA75xxx (TG-7) vs BJ6C... (TG-6); project lead, session 2026-09-23 ('FSL-08+ are TG-7s')"
  confidence: high
  dives_before: 517
