# ---------------------------------------------------------------- hardware
- date: 2023-08 .. 2024-12 (staggered by camera)
  component: hardware
  change: "Laser red -> green. Per camera (first mostly-green dive): FSL-02 2024-03, FSL-06 2024-03, FSL-01 2024-06, FSL-04 2024-06, FSL-05 2024-06, FSL-03 2024-12. Isolated green dives in 2023 (2023-10-19, 2023-10-27) are probably camera-clock or test dives."
  label: "red → green laser"
  driver: human
  driver_detail: "Green chosen because it penetrates further in water; expected to be easier to see. Outcome: easier for divers, harder for automated detection."
  evidence: "DB laserlabel colour per dive (>=90% of a dive's labels one colour), grouped by camera and month; stated rationale at the time: papers/fishsense-lite-imwut/Sections/system.tex L163 (green 'penetrates water further'); outcome: project lead, analysis session 2026-09-26 (green lasers 'are easier on the diver'), author account 2026-10-07; detector and labeller cost: analysis/codesign/redgreen.py, before_after.py"
  confidence: medium
  dives_before: "mostly-red dives: 2023-08..2024-02: 171; 2024 mixed by camera"
  dives_after: "mostly-green dives 2024-03..2024-12: 97 (red still on FSL-03 until 2024-12)"
  note: "Staggered adoption gives concurrent red and green dives at the same sites; usable for task 3d. The IMWUT text gives the rationale at the time (penetration, reliable detection); this paper reports the outcome: easier for divers, harder for the detector (missed +16 pt within camera and setting) and slower to label (+1.8 s within labeller). Red was chosen first because fish behaviour should be less affected (author account 2026-10-06)."

- date: 2023-08 onward (constraint, not a revision)
  component: hardware
  change: "Lasers are commodity, eye-safe dive laser pointers; their power was never controlled. Recorded models: 'Innovative Scuba Aluminum Laser Pointer (Red)' ($89.95, IMWUT cost table). Green: two different products, a 'Shark' laser (apparently no longer sold) and an Orca Torch laser (author account 2026-10-06); the IMWUT text describes the green as a 'Class IIIA waterproof green (532 nm) pointer' without naming a product."
  label: "commodity lasers"
  driver: n/a (constraint)
  evidence: "author account 2026-10-06; papers/fishsense-lite-imwut/Sections/system.tex L11 and L163. No laser model, part number or power field in the DB (camera: id, serial_number, name; dive: no laser field); no dive note names a laser."
  confidence: medium
  dives_before: n/a
  dives_after: n/a
  note: "Which green product was on which camera, and when, is unknown (no DB field) - questions.md B1. The two green products may differ in power, divergence and dot shape, which confounds the red-vs-green comparison (task 3d). Whether the red product changed is unknown. The Shark laser's apparent discontinuation is itself a commodity-supply constraint. The partner's newer, separate system uses higher-powered lasers; it is not a revision of this system."

