# FishSense Lite design-revision timeline (SenSys 2027 co-design paper, task 1).
# Built 2026-10-06 from the restored production DB (container p2-fishsense-db, dump 2026-09-25),
# fishsense-lite git history, the UCSD-E4E repo list, live Temporal (data/temporal/workflow_runs.csv),
# Temporal persistence backups (data/temporal/workflow_runs_may2026.csv), and project-lead statements
# made in the analysis sessions. driver is set only where a record states the reason; otherwise
# `unknown` and the item is in questions.md.
#
# driver: human   = made to reduce a person's burden or meet a person's preference (diver, labeller, operator)
#         machine = made so an automated stage could work
#         other   = a stated reason that is neither (durability, data quality)
#         unknown = no record of why
# Dive counts are dives in the DB (525 total, 2023-08-01 .. 2025-01-17; camera clocks, so a few dates are off).
# Changes after 2025-01-17 alter processing, not capture: no new dives were collected after them.

# ---------------------------------------------------------------- calibration
- date: before 2023-08-01 (exact date unknown)
  component: calibration
  change: "Calibration plan changes from once per camera lifetime (lens) and once per mount lifetime (laser), with cameras shipped so as to preserve the laser calibration, to per-dive laser calibration in the field."
  driver: other
  driver_detail: physical failure - the first unit shipped to the partner had a PLA mount that warped and broke over time, so its laser calibration drifted.
  evidence: author account, 2026-10-06 (answers recorded in questions.md R)
  confidence: medium (reason); low (date)
  dives_before: unknown
  dives_after: n/a

- date: 2023-08 (14-18 Aug)
  component: calibration
  change: Pool sessions calibrated with a planar printed checkerboard shot in the same session.
  driver: unknown
  evidence: "imwut_2026_fishsense_lite/PAPER.md L259-264 (\"The first nineteen sessions (14-18 August) used a planar checkerboard ... The remaining twelve (29-31 August) used the duct-tape dive slate ... We moved *away* from the checkerboard deliberately\"); DB: 15 dives with calibration_target_id = 1 (E4E Checkerboard, 10x14, 42.17 mm pitch), 2023-08-14..18, named LaserCalibration*; dive 490 note (checkerboard burst with the laser on, laser rotated 0.82 deg in-plane between fish frames and board burst); dive 521 note (laser-calibration and lens-calibration frames in one folder, lens frames have no laser) - so the board was used for laser calibration, distinct from lens calibration. TG-7 units again calibrated against checkerboards on 2025-01-17 (dives 480, 481); PerformCheckerboardCalibration automated 2026-09-08."
  confidence: high (checkerboard used in these pool sessions); low (that this was a checkerboard -> slate switch)
  dives_before: 0
  dives_after: "15 dives linked to the E4E Checkerboard target (DB dive.calibration_target_id = 1), 2023-08-14..18"
  note: "NOT recorded as a switch. The author's account is that the checkerboard was the lens-calibration target (later replaced by LEGO in the WUWNet paper) and the slate the per-dive laser target. The IMWUT draft says otherwise for the pool sessions, but the field H-Slate (2023-08-01) predates the checkerboard sessions, so the draft's ordering does not hold for the field. Open question, questions.md A1."

- date: 2023-08-01 .. 2023-08-03
  component: calibration
  change: Duct-tape H-Slate used as the per-dive laser calibration target in the field (stop-gap once per-dive calibration became necessary).
  driver: other
  driver_detail: introduced because of mount drift (physical failure); solved with a human-labelled method by default.
  evidence: "DB diveslate id 1 'H-Slate': 4 dives, 2023-08-01..03 (select ... from diveslate join dive); author account, 2026-10-06"
  confidence: high
  dives_before: 0
  dives_after: 4
  note: the tape patterns were chosen so humans could label keypoints; computers were very poor at this (author account).

- date: 2023-08-29 .. 2023-11-14
  component: calibration
  change: Slate pattern H -> Tic-Tac-Toe (Tic-Tac-Toe 1, 2, 4, 5, 6); partner asked to build tic-tac-toe slates as more cameras shipped.
  driver: human
  driver_detail: labelability - the H had too few easily markable points, and divers' hands covered some of them; tic-tac-toe gives more keypoints.
  evidence: "DB diveslate ids 2,3,5,6,7: 22 dives, first 2023-08-29 (TTT1), last 2023-11-14 (TTT2); author account, 2026-10-06"
  confidence: high
  dives_before: 4
  dives_after: 22
  note: dive_slate_id is set on only 36 of 525 dives, so per-dive slate type is known for a minority.

- date: 2024-03-13 .. 2024-12-10
  component: calibration
  change: Slate pattern Tic-Tac-Toe -> V-Slate (chevron; V-Slate 1-4; 6 reference points by design vs 8 on H and Tic-Tac-Toe).
  driver: human
  driver_detail: labelability - labellers could not tell the tic-tac-toe slate's rotation/origin because the pattern is symmetric; the chevron breaks the symmetry.
  evidence: "DB diveslate ids 8-11: 10 dives, first 2024-03-13 (V-Slate 1), last 2024-12-10; author account, 2026-10-06"
  confidence: high
  dives_before: 26
  dives_after: 10

